name: parity-tooling-cli
settings:
  base:
    SWIFT_VERSION: "6.4"
targets:
  ParityTool:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/ParityTool
        optional: false
    releaseIdentity:
      bundleIdentifier: com.wrkstrm.parity.tooling-cli
      shortVersion: "0.9.0"
      buildVersion: "90"
      generateInfoPlist: true
      sparkleFeedURL: https://updates.example.com/parity-tooling-cli/appcast.xml
    settings:
      base:
        PRODUCT_NAME: parity-tool
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
    postBuildScripts:
      - name: Install Tool Sidecar
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          echo "install sidecar"
schemes:
  ParityTool:
    shared: true
    build:
      targets:
        ParityTool: all
    run:
      config: Debug
